<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>文鮮明先生御言選集 日韓対訳リーダー</title>
<link rel="stylesheet" href="style.css?v=20261123-2">
</head>
<body>
<div class="home-wrap">
  <h1>文鮮明先生御言選集</h1>
  <div class="home-sub" id="summary">日韓対訳リーダー</div>
  <a id="resumeHome" class="resume-home" href="#" style="display:none"></a>
  <input class="home-search" id="filter" type="search" placeholder="巻番号で絞り込み（例：119）">
  <div class="vol-grid" id="grid"></div>
</div>
<script>
(function(){
  try{
    const lr=JSON.parse(localStorage.getItem('malsseum_last_read')||'null');
    if(lr && lr.volume && lr.page){
      const a=document.getElementById('resumeHome');
      a.textContent='前回の続きから読む ― 第'+lr.volume+'巻 '+(lr.lecture?('第'+lr.lecture+'講 '):'')+'p.'+lr.page;
      a.href='reader.html?vol='+lr.volume+(lr.lecture?('#lec'+lr.lecture+'-p'+lr.page):('#p'+lr.page));
      a.style.display='block';
    }
  }catch(e){}
})();
fetch('data/index.json?v=20261123-2').then(r=>r.json()).then(idx=>{
  const vols=idx.volumes;
  const totalPages=vols.reduce((a,v)=>a+v.pages,0);
  document.getElementById('summary').textContent=
    `日韓対訳リーダー ― 全${vols.length}巻・${totalPages.toLocaleString()}ページ`;
  const grid=document.getElementById('grid');
  function render(list){
    grid.innerHTML=list.map(v=>
      `<a class="vol-card" href="reader.html?vol=${v.volume}">
         <div class="v">第${v.volume}巻</div>
         <div class="m">${v.pages}ページ／${v.lectures.length}講<br>日本語 ${v.jaChars.toLocaleString()}字</div>
       </a>`).join('');
  }
  render(vols);
  document.getElementById('filter').addEventListener('input',e=>{
    const q=e.target.value.trim();
    render(q?vols.filter(v=>String(v.volume).includes(q)):vols);
  });
}).catch(()=>{document.getElementById('summary').textContent='データの読み込みに失敗しました。';});
</script>
</body>
</html>
